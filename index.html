<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lá Chắn Rồng 3D – Tập trận đa quốc gia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe8d8; --panel:#f8f3e6; --panel2:#f1e9d6; --ink:#2a1a12; --muted:#6f5b4b; --line:#d8cbb0;
  --btn:#efe4cc; --btnh:#e6d6b4; --lacquer:#a8201a; --gold:#b9841a; --ok:#2f7d3b;
  --overlay:rgba(239,232,216,.96); --chip:#fff9ec; --hud:rgba(25,14,10,.84); --hudink:#f6e7c8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#140d0a; --panel:#1d1410; --panel2:#251a14; --ink:#f3e7cf; --muted:#b39c80; --line:#3a2a20;
    --btn:#2a1d16; --btnh:#3a281d; --lacquer:#e2463b; --gold:#f0c24e; --ok:#6fd07b;
    --overlay:rgba(20,13,10,.96); --chip:#24180f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#140d0a; --panel:#1d1410; --panel2:#251a14; --ink:#f3e7cf; --muted:#b39c80; --line:#3a2a20;
  --btn:#2a1d16; --btnh:#3a281d; --lacquer:#e2463b; --gold:#f0c24e; --ok:#6fd07b;
  --overlay:rgba(20,13,10,.96); --chip:#24180f; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--panel);border-bottom:2px solid var(--lacquer);overflow-x:auto;white-space:nowrap;scrollbar-width:none;flex:none}
#topbar::-webkit-scrollbar{display:none}
.brand{font-weight:800;display:flex;align-items:center;gap:7px;font-size:14.5px;flex:none}
.brand img{width:30px;height:20px;border-radius:3px;border:1px solid var(--line);display:block}
.stats{display:flex;gap:6px;flex:none}
.stat{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.stat b{color:var(--gold);font-weight:800}
.stat i{font-style:normal;color:var(--muted);font-weight:600}
.sys{display:flex;gap:4px;margin-left:auto;flex:none}
.tb{border:1px solid var(--line);background:var(--btn);border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer;flex:none}
.tb:hover{background:var(--btnh)}
.tb.on{background:var(--lacquer);color:#fff;border-color:var(--lacquer)}
#main{flex:1;display:flex;min-height:0}
#view{flex:1;position:relative;min-width:0;background:#a9cde6;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
#hud{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}
#toasts{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none;z-index:3;max-width:62%}
.toast{background:var(--hud);color:var(--hudink);border-left:3px solid #f0c24e;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:600;transition:opacity .4s}
.toast.bad{border-left-color:#ff5a4d}
.toast.good{border-left-color:#6fd07b}
#objBox{position:absolute;top:8px;left:8px;z-index:3;pointer-events:none;background:var(--hud);color:var(--hudink);border-left:3px solid #f0c24e;border-radius:6px;padding:7px 11px;font-size:12.5px;line-height:1.45;max-width:min(240px,38%);display:none}
#fpsBox{position:absolute;right:8px;bottom:60px;z-index:3;pointer-events:none;background:var(--hud);color:var(--hudink);border-radius:6px;padding:5px 9px;font:600 11px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre;display:none;border-left:3px solid #38bdf8}
#objBox b{color:#f0c24e;font-weight:800}
.stat.low{background:#a8201a;color:#fff}.stat.low b{color:#fff}
#objBox span{color:#9fe0a8}
#terrTip{position:absolute;right:8px;bottom:8px;z-index:3;pointer-events:none;background:var(--hud);color:var(--hudink);border-radius:6px;padding:5px 10px;font-size:12px;max-width:min(420px,60%);display:none;border-left:3px solid #6fd07b}
#modeHint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--hud);color:var(--hudink);padding:6px 14px;border-radius:999px;font-size:12.5px;display:none;z-index:4;pointer-events:none;border:1px solid #f0c24e}
#cmdBar{position:absolute;left:8px;bottom:8px;z-index:3;display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;max-width:calc(100% - 16px);align-items:flex-end;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom,0px)}
#cmdBar::-webkit-scrollbar{display:none}
.mobile-only{display:none!important}
.cb{display:flex;align-items:center;gap:6px;border:1px solid rgba(240,194,78,.35);background:var(--hud);color:var(--hudink);border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;cursor:pointer;min-height:36px}
.cb:hover{border-color:#f0c24e}
.cb.on{background:#a8201a;border-color:#f0c24e;color:#fff}
.cb kbd{font:600 10px ui-monospace,Menlo,monospace;opacity:.65;border:1px solid rgba(246,231,200,.35);border-radius:4px;padding:0 4px}
.pw{position:relative;overflow:hidden;font-weight:800}
.pw .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(240,194,78,.4),rgba(226,70,59,.45));pointer-events:none}
.pw span{position:relative}
.pw.ready{border-color:#f0c24e;box-shadow:0 0 0 2px rgba(240,194,78,.5)}
#panel{width:276px;flex:none;background:var(--panel);border-left:2px solid var(--lacquer);display:flex;flex-direction:column;gap:8px;padding:8px;overflow-y:auto}
#leftCol{width:178px;flex:none;background:var(--panel);border-right:2px solid var(--lacquer);display:flex;flex-direction:column;gap:8px;padding:8px;overflow-y:auto}
#leftCol #mini{width:160px;max-height:none}
#miniWrap{display:flex;flex-direction:column;align-items:center;gap:4px}
#pwrBox{width:100%;max-width:160px;margin-top:4px;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px}
.pwr-head{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.pwr-head b{font-variant-numeric:tabular-nums;color:var(--ink)}
.pwr-bar{position:relative;height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:5px 0 4px}
.pwr-bar em{position:absolute;left:0;top:0;bottom:0;width:0;background:#2f9e44;border-radius:4px;transition:width .3s ease,background .3s ease}
.pwr-note{font-size:11px;color:var(--muted);line-height:1.35}
#pwrBox.warn .pwr-bar em{background:#e0a21e}
#pwrBox.low{border-color:#a8201a}
#pwrBox.low .pwr-bar em{background:#c92a2a}
#pwrBox.low .pwr-note{color:#c92a2a;font-weight:700}
#mapName{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#mini{width:150px;max-width:100%;height:auto;max-height:250px;border-radius:6px;border:2px solid var(--line);touch-action:none;cursor:pointer;background:#0f3150;display:block}
#rightCol{display:flex;flex-direction:column;gap:8px;min-width:0}
#tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
#tabs button{border:1px solid var(--line);background:var(--btn);border-radius:8px;padding:6px 2px;font-weight:700;font-size:11.5px;cursor:pointer}
#tabs button.on{background:var(--lacquer);color:#fff;border-color:var(--lacquer)}
#items{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.item{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--btn);border-radius:9px;padding:6px 3px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:76px;text-align:center}
.item:hover{background:var(--btnh);border-color:var(--gold)}
.item svg{width:25px;height:25px;flex:none}
.item .nm{font-size:10.5px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.item .cs{font-size:11px;color:var(--gold);font-weight:800;margin-top:auto}
.item .pg{position:absolute;left:0;bottom:0;height:4px;background:var(--gold);width:0}
.item .q{position:absolute;top:2px;right:4px;font-size:11px;font-weight:800;color:#fff;background:var(--lacquer);border-radius:999px;min-width:16px;line-height:16px;padding:0 3px;display:none}
.item .q.show{display:block}
.item.locked{opacity:.38}
.item.poor .cs{color:var(--lacquer)}
.item.ready{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.item.ready .cs{color:var(--ok)}
#itemInfo,#selInfo{font-size:12px;line-height:1.4;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 9px;color:var(--muted)}
#itemInfo b,#selInfo strong{color:var(--ink);font-size:13px;display:block}
#itemInfo .cost{color:var(--gold);font-weight:800;font-size:11.5px}
#itemInfo p{margin:4px 0 0}
#itemInfo .req{color:var(--lacquer);font-weight:700}
#itemInfo .good{color:var(--ok);font-weight:600}
.bars{display:grid;gap:3px;margin-top:6px}
.bars div{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:6px;font-size:11px}
.bars i{height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:block}
.bars em{display:block;height:100%;background:var(--gold);border-radius:3px}
.hp{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin:4px 0}
.hp em{display:block;height:100%;background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chips span{display:inline-flex;align-items:center;gap:3px;background:var(--btn);border:1px solid var(--line);border-radius:6px;padding:2px 5px;font-weight:700;color:var(--ink);font-size:11.5px}
.chips svg{width:15px;height:15px}
#sellBtn{align-self:flex-start}
#overlay{position:fixed;inset:0;background:var(--overlay);z-index:10;display:flex;align-items:flex-start;justify-content:center;padding:18px 14px;overflow-y:auto}
#overlay.hide{display:none}
.card{max-width:980px;width:100%;margin:auto}
.card h1{font-size:clamp(32px,6vw,50px);line-height:1;margin:0 0 4px;font-weight:800;color:var(--lacquer);letter-spacing:-.02em}
.card .sub{font-size:15.5px;font-weight:600;color:var(--gold);margin:0 0 12px}
.card p{line-height:1.55;margin:0 0 10px;max-width:70ch}
.card h3{margin:18px 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.pick{border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:5px}
.pick:hover{border-color:var(--gold)}
.pick.on{border-color:var(--lacquer);box-shadow:0 0 0 2px var(--lacquer)}
.pick canvas,.pick img{width:100%;height:auto;border-radius:7px;display:block;border:1px solid var(--line)}
.pick b{font-size:14px}
.pick small{color:var(--muted);font-size:11.5px;line-height:1.35}
.pick .tag{color:var(--gold);font-weight:800;font-size:11px}
.natpick{flex-direction:row;align-items:center;gap:10px}
.natpick img{width:54px;flex:none}
.desc{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.5;margin-top:8px}
.desc b{color:var(--lacquer)}
.choices{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.choice{border:1.5px solid var(--line);background:var(--btn);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:700;font-size:13.5px}
.choice.on{border-color:var(--lacquer);background:var(--lacquer);color:#fff}
.slot{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.slot i{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid var(--ink)}
.slot select{border:1.5px solid var(--line);background:var(--btn);border-radius:8px;padding:6px 8px}
.go{margin-top:18px;border:none;background:var(--lacquer);color:#fff;font-weight:800;font-size:17px;padding:12px 28px;border-radius:12px;cursor:pointer}
.go:hover{filter:brightness(1.08)}
.go.alt{background:var(--btn);color:var(--ink);border:1.5px solid var(--line);margin-left:8px}
details{margin-top:14px}
summary{cursor:pointer;font-weight:700;font-size:14px}
.help{font-size:13.5px;color:var(--muted);line-height:1.6;padding-left:18px;margin:6px 0 0}
.help b{color:var(--ink)}
/* Kho Khí Tài Vũ Trang 3D */
.arsenal-box{margin-top:14px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.arsenal-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px}
.arsenal-title{display:flex;align-items:center;gap:10px}
.arsenal-flag{width:40px;height:26px;border-radius:4px;border:1px solid var(--line);flex:none;object-fit:cover}
.arsenal-title h4{margin:0;font-size:15.5px;font-weight:800;color:var(--lacquer);letter-spacing:-.01em}
.arsenal-title p{margin:2px 0 0;font-size:12px;color:var(--muted);line-height:1.4}
.arsenal-power{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--line);padding:5px 11px;border-radius:8px;font-size:12px;color:var(--muted)}
.arsenal-power b{color:var(--lacquer)}
.arsenal-body{display:grid;grid-template-columns:1.05fr 1fr;gap:14px;align-items:stretch}
.arsenal-view-wrap{--a3d-bg1:#fbf6ea;--a3d-bg2:#e7dbc1;position:relative;background:radial-gradient(circle at 50% 38%,var(--a3d-bg1) 0%,var(--a3d-bg2) 85%);border-radius:12px;border:1px solid var(--line);overflow:hidden;min-height:290px;display:flex;flex-direction:column;justify-content:center;align-items:center;user-select:none;touch-action:none}
#arsenalCanvas{width:100%;height:290px;display:block;cursor:grab}
#arsenalCanvas:active{cursor:grabbing}
.arsenal-hud-top{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.arsenal-cur-badge{background:var(--chip);border:1px solid var(--line);padding:4px 10px;border-radius:7px}
.arsenal-cur-name{font-size:14px;font-weight:800;color:var(--ink);letter-spacing:.01em}
.arsenal-cur-role{font-size:11px;font-weight:600;color:var(--muted)}
.arsenal-view-btns{display:flex;gap:6px;pointer-events:auto}
.a3d-btn{background:var(--btn);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;transition:background .15s ease}
.a3d-btn:hover{background:var(--btnh)}
.a3d-btn.on{background:var(--lacquer);border-color:var(--lacquer);color:#fff}
.arsenal-hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:var(--chip);border:1px solid var(--line);color:var(--muted);padding:3px 12px;border-radius:999px;font-size:11px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis}
.arsenal-detail{display:flex;flex-direction:column;gap:10px;min-width:0}
.arsenal-tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px;max-height:176px;overflow-y:auto;padding-right:4px;scrollbar-width:thin}
.arsenal-tab{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:7px;align-items:center;background:var(--btn);border:1px solid var(--line);color:var(--ink);padding:5px 8px;border-radius:8px;font:inherit;font-size:12px;cursor:pointer;transition:background .12s ease,border-color .12s ease;user-select:none;text-align:left;min-width:0}
.arsenal-tab:hover{background:var(--btnh)}
.arsenal-tab.on{background:var(--lacquer);border-color:var(--lacquer);color:#fff}
.arsenal-tab .tab-icon{font-size:15px;grid-row:1 / 3}
.arsenal-tab .tab-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arsenal-tab .tab-role{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arsenal-tab.on .tab-role{color:rgba(255,255,255,.85)}
.arsenal-specs{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:8px;flex:1}
.arsenal-desc{font-size:12.5px;line-height:1.5;color:var(--ink)}
.arsenal-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.stat-row{display:grid;grid-template-columns:56px 1fr 38px;align-items:center;gap:6px;font-size:11.5px}
.stat-lbl{color:var(--muted);font-weight:600}
.stat-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.stat-bar em{display:block;height:100%;border-radius:3px}
.stat-val{text-align:right;font-weight:700;font-family:ui-monospace,Menlo,monospace;color:var(--ink)}
.arsenal-meta-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.arsenal-meta-chip{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-size:11.5px;color:var(--muted)}
.arsenal-meta-chip b{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .arsenal-view-wrap{--a3d-bg1:#3a2a20;--a3d-bg2:#160f0b}}
:root[data-theme="dark"] .arsenal-view-wrap{--a3d-bg1:#3a2a20;--a3d-bg2:#160f0b}
@media (max-width:760px), (max-height:520px){
  .mobile-only{display:flex!important}
  #main{flex-direction:column}
  #panel{width:auto;height:178px;flex-direction:row;border-left:none;border-top:2px solid var(--lacquer);padding:6px;gap:6px;overflow:hidden;transition:height .25s ease,opacity .25s ease}
  #panel.collapsed{height:0!important;min-height:0!important;padding:0!important;border:none!important;overflow:hidden!important;pointer-events:none!important;opacity:0}
  #leftCol{display:none}
  #miniWrap{flex:none;justify-content:center}
  #mapName{display:none}
  #pwrBox{display:none}
  #mini{width:auto;max-width:112px;max-height:160px}
  #rightCol{flex:1;gap:5px}
  #items{display:flex;overflow-x:auto;gap:6px;padding-bottom:2px}
  .item{flex:none;width:84px;min-height:74px}
  #itemInfo,#selInfo,#sellBtn{display:none!important}
  .cb{padding:8px 10px;min-height:40px;flex:none;touch-action:manipulation}.cb .lb,.cb kbd{display:none}
  #powerBtn .lb{display:inline}
  .brand span{display:none}
  .stat{padding:3px 7px;font-size:11.5px}
  .tb{padding:5px 7px}
  .arsenal-body{grid-template-columns:1fr}
  #arsenalCanvas{height:240px}
  .arsenal-view-wrap{min-height:240px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><img id="natFlag" alt="" width="30" height="20"><span id="natName">Lá Chắn Rồng</span></div>
    <div class="stats">
      <span class="stat" title="Ngân sách và thu nhập mỗi giây">💰 <b id="credits">0</b> <i id="income"></i></span>
      <span class="stat" title="Quân số hiện có trên giới hạn">🪖 <b id="pop">0</b></span>
      <span class="stat" id="pwrStat" title="Điện: đang dùng / đang cấp. Thiếu điện thì xây dựng, sản xuất và vũ khí công trình chậm lại">⚡ Điện <b id="pwr">0/0</b></span>

  if(t<0||!pass(t,c)){t=nearestPassable(t<0?cellAt(clamp(tx,1,W-1),clamp(ty,1,H-1)):t,c,30);if(t<0)return null;tx=cxw(t);ty=cyw(t);}
  if(s===t)return{pts:[{x:tx,y:ty}],partial:false};
  gen++;hs=0;
  const txc=t%GW,tyc=(t/GW)|0;
  const h=i=>{const dx=Math.abs(i%GW-txc),dy=Math.abs(((i/GW)|0)-tyc);return dx+dy-.5858*Math.min(dx,dy);};
  const CC=c==='veh'?cVeh:c==='land'?cInf:null,HW=CC?.86:1.04;
  gS[s]=0;seen[s]=gen;from[s]=-1;hpush(s,h(s));
  let best=s,bh=h(s),it=0;
  while(hs>0&&it<N){
    const cur=hpop();if(closed[cur]===gen)continue;closed[cur]=gen;it++;
    if(cur===t){best=t;break;}
    const hc=h(cur);if(hc<bh){bh=hc;best=cur;}
    const x=cur%GW,y=(cur/GW)|0,g0=gS[cur];
    for(let k=0;k<8;k++){
      const dx=DX[k],dy=DY[k],nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=GW||ny>=GH)continue;
      const ni=ny*GW+nx;if(closed[ni]===gen||!pass(ni,c))continue;
      if(dx&&dy&&(!pass(y*GW+nx,c)||!pass(ny*GW+x,c)))continue;
      const ng=g0+(dx&&dy?1.4142:1)*(CC?CC[ni]:1);
      if(seen[ni]!==gen||ng<gS[ni]){seen[ni]=gen;gS[ni]=ng;from[ni]=cur;hpush(ni,ng+h(ni)*HW);}
    }
  }
  const cells=[];let k=best,guard=0;
  while(k>=0&&guard++<N){cells.push(k);if(k===s)break;k=from[k];}
  cells.reverse();
  const pts=cells.slice(1).map(i=>({x:cxw(i),y:cyw(i)}));
  if(!pts.length)return{pts:[{x:cxw(best),y:cyw(best)}],partial:best!==t};
  if(best===t)pts[pts.length-1]={x:tx,y:ty};
  const out=[];let a={x:sx,y:sy},i=0;
  while(i<pts.length){let j=Math.min(pts.length-1,i+14);while(j>i&&!los(a,pts[j],c))j--;out.push(pts[j]);a=pts[j];i=j+1;}
  return{pts:out,partial:best!==t};
}

let evaLastSpeak=0;
function evaSpeak(text){
  if(typeof window==='undefined'||!window.speechSynthesis)return;
  const now=Date.now();if(now-evaLastSpeak<2500)return;evaLastSpeak=now;
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.rate=1.05;u.pitch=1.0;u.lang='vi-VN';
    window.speechSynthesis.speak(u);
  }catch(_){}
}
let lastVoiceT=0;
function unitVoice(type){
  const now=performance.now();if(now-lastVoiceT<1200)return;lastVoiceT=now;
  const lines={
    select:['Sẵn sàng nhận lệnh!','Nghe rõ!','Chờ lệnh!','Báo cáo, sẵn sàng!'],
    move:['Rõ, tuân lệnh!','Xuất kích!','Lăn bánh!','Đang cơ động!','Hành quân ngay!'],
    attack:['Khai hỏa!','Tiêu diệt mục tiêu!','Tập trung hỏa lực!','Tấn công!']
  };
  const arr=lines[type]||lines.select;
  const line=arr[(Math.random()*arr.length)|0];
  if(typeof window!=='undefined'&&window.speechSynthesis){
    try{
      const u=new SpeechSynthesisUtterance(line);
      u.rate=1.2;u.pitch=1.05;u.lang='vi-VN';
      window.speechSynthesis.speak(u);
    }catch(_){}
  }
}

function addXP(u,amt){
  if(!u||u.dead||u.kind!=='u'||!u.d)return;
  u.xp=(u.xp||0)+amt;
  const cost=u.d.cost||100;
  const prevRank=u.rank||0;
  let newRank=0;
  if(u.xp>=cost*3.5)newRank=2;
  else if(u.xp>=cost*1.5)newRank=1;
  if(newRank>prevRank){
    u.rank=newRank;
    u.maxHp=Math.round(u.d.hp*(newRank===2?1.5:1.25));
    const healBonus=Math.round(u.d.hp*(newRank===2?0.5:0.25));
    u.hp=Math.min(u.maxHp,u.hp+healBonus);
    G.fx.push({k:'ring',x:u.x,y:u.y,t:45,T:45,c:newRank===2?'#ff3333':'#ffd23f'});
    if(u.team===1){
      const rankTitle=newRank===2?'Tinh nhuệ ★★★':'Kỳ cựu ★';
      toast(u.d.name+' thăng cấp '+rankTitle+'!','good');
      evaSpeak(u.d.name+' thăng cấp '+(newRank===2?'tinh nhuệ':'kỳ cựu'));
    }
  }
}

  const b={id:nextId++,kind:'b',type,d,team,cx,cy,s,x:(cx+s/2)*CELL,y:(cy+s/2)*CELL,hw:s*CELL/2,hp:d.hp,cd:0,ta:0,tgt:null,anim:0,hitT:-999};
  for(let y=cy;y<cy+s;y++)for(let x=cx;x<cx+s;x++)occ[y*GW+x]++;
  G.blds.push(b);
  for(const u of G.units){if(u.d.cls!=='land')continue;const i=cellAt(u.x,u.y);if(i>=0&&occ[i]){const j=nearestPassable(i,u.d.mv,8);if(j>=0){u.x=cxw(j);u.y=cyw(j);}u.path=null;}}
  return b;
}
function canPlace(team,type,cx,cy,free){
  const d=BT[type],s=d.size;
  for(let y=cy-1;y<=cy+s;y++)for(let x=cx-1;x<=cx+s;x++){
    if(x<0||y<0||x>=GW||y>=GH)return false;
    const i=y*GW+x,inside=x>=cx&&x<cx+s&&y>=cy&&y<cy+s;
    if(!d.dep&&depCell&&depCell[i])return false;   // chừa trống điểm tài nguyên và một ô quanh nó
    if(inside){if(terr[i]!==1||occ[i]||tSlope[i]>.45)return false;}else if(occ[i])return false;
  }
  if(d.dep&&!DEPS.some(q=>q.k===d.dep&&q.cx===cx&&q.cy===cy))return false;
  const bx=(cx+s/2)*CELL,by=(cy+s/2)*CELL,hw=s*CELL/2;
  for(const c of G.cities)if(hyp(c.x-bx,c.y-by)<hw+(c.lm?58:26))return false;
  if(!free){
    let ok=false;
    for(const b of G.blds)if(!b.dead&&b.team===team&&hyp(b.x-bx,b.y-by)<230+b.hw){ok=true;break;}
    if(!ok)for(const c of G.cities)if(c.owner===team&&hyp(c.x-bx,c.y-by)<210){ok=true;break;}
    if(!ok)return false;
  }
  if(d.coast){
    let sea=false;
    for(let y=cy-2;y<=cy+s+1&&!sea;y++)for(let x=cx-2;x<=cx+s+1;x++){if(x<0||y<0||x>=GW||y>=GH)continue;if(terr[y*GW+x]===0){sea=true;break;}}
    if(!sea)return false;
  }
  return true;
}
function findSpot(team,type,x,y,free,rMin=1,rMax=18){
  const s=BT[type].size,c0x=Math.floor(x/CELL),c0y=Math.floor(y/CELL);
  for(let r=rMin;r<=rMax;r++){
    const cand=[];
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(Math.max(Math.abs(dx),Math.abs(dy))===r)cand.push([dx,dy]);
    for(let i=cand.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[cand[i],cand[j]]=[cand[j],cand[i]];}
    for(const [dx,dy] of cand){const cx=c0x+dx-(s>>1),cy=c0y+dy-(s>>1);if(canPlace(team,type,cx,cy,free))return{cx,cy};}
  }
  return null;
}

function stamp(x,y,r){const cx=Math.floor(x/CELL),cy=Math.floor(y/CELL),cr=Math.ceil(r/CELL),r2=(r/CELL)*(r/CELL);
  for(let dy=-cr;dy<=cr;dy++){const Y=cy+dy;if(Y<0||Y>=GH)continue;for(let dx=-cr;dx<=cr;dx++){const X=cx+dx;if(X<0||X>=GW||dx*dx+dy*dy>r2)continue;const i=Y*GW+X;vis[i]=1;expl[i]=1;}}}
/* Sương mù chiến tranh tính theo phần thay đổi: chỉ ghi lại vùng ô có vis đổi (fogBox) để applyFog/bản đồ nhỏ không phải quét lại cả bản đồ. */
let visPrev=null,fogBox=null,fogVer=0;
function computeFog(){
  if(!visPrev||visPrev.length!==N)visPrev=new Uint8Array(N);
  visPrev.set(vis);vis.fill(0);
  for(const u of G.units)if(!u.dead&&u.team===1)stamp(u.x,u.y,u.d.sight+30+Math.min(90,groundY(u.x,u.y)*.7));
  for(const b of G.blds)if(!b.dead&&b.team===1)stamp(b.x,b.y,b.type==='hq'?270:b.type==='radar'?(G.teams[1].pf>=1&&b.anim>=1?640:175):(b.type==='tower'||b.type==='crossbow'||b.type==='sam'||b.type==='coastal')?250:b.type==='pylon'?110:175);
  for(const c of G.cities)if(c.owner===1)stamp(c.x,c.y,160);
  let x0=GW,y0=GH,x1=-1,y1=-1;
  for(let i=0;i<N;i++)if(vis[i]!==visPrev[i]){const x=i%GW,y=(i/GW)|0;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x1>=0){fogVer++;fogBox=fogBox?[Math.min(fogBox[0],x0),Math.min(fogBox[1],y0),Math.max(fogBox[2],x1),Math.max(fogBox[3],y1)]:[x0,y0,x1,y1];}}
const seenBy=(team,e)=>{
  if(!e)return false;
  if(e.kind==='u'&&e.d.role==='sub'&&e.team!==team){
    if(G.frame-e.hitT<180||(e.lastShot&&G.frame-e.lastShot<180))return true;
    for(const u of G.units){
      if(!u.dead&&u.team===team){
        const rDet=(u.d.role==='sub'||u.d.role==='ship'||u.d.role==='heli'||u.d.role==='scout')?130:55;
        if(hyp(u.x-e.x,u.y-e.y)<rDet)return true;
      }
    }
    return false;
  }
  if(team===1){
    const i=cellAt(e.x,e.y);
    return !(i<0||!(e.kind==='b'?expl[i]:vis[i]));
  }
  return true;
};

function regen(){
  for(const e of G.units){if(e.dead||e.d.role!=='eng')continue;
    for(const u of G.units){const maxHp=u.maxHp||u.d.hp;if(u.dead||u.team!==e.team||u===e||u.hp>=maxHp||u.d.cls==='air')continue;
      if(Math.abs(u.x-e.x)<78&&hyp(u.x-e.x,u.y-e.y)<78){u.hp=Math.min(maxHp,u.hp+u.d.hp*.025+2);if(G.parts.length<PMAX-50)G.parts.push({x:u.x,y:u.y,z:8,vx:0,vy:0,vz:.35,t:24,T:24,c:'heal'});}}
    for(const b of G.blds){if(b.dead||b.team!==e.team||b.hp>=b.d.hp)continue;if(hyp(b.x-e.x,b.y-e.y)<78+b.hw)b.hp=Math.min(b.d.hp,b.hp+b.d.hp*.02);}}
  for(const b of G.blds){if(!b.dead&&G.frame-b.hitT>600&&b.hp<b.d.hp)b.hp=Math.min(b.d.hp,b.hp+b.d.hp*.012);}
  for(const u of G.units){
    if(u.dead)continue;
    const maxHp=u.maxHp||u.d.hp;
    // Elite Auto-repair: khi u.rank === 2 và sau 3s không bị dính sát thương, tự hồi 1.5% maxHp/giây
    if(u.rank===2&&(G.frame-(u.lastHurtT||0)>180)&&u.hp<maxHp){
      u.hp=Math.min(maxHp,u.hp+(maxHp*0.015)/60);
      if(u.team===1&&G.frame%30===0&&G.parts.length<PMAX-50){
        G.parts.push({x:u.x+rnd(-4,4),y:u.y+rnd(-4,4),z:8,vx:0,vy:0,vz:.35,t:20,T:20,c:'heal'});
      }
    }
    if(u.hp>=maxHp||G.frame-u.hitT<300)continue;
    let ok=false;
    for(const c of G.cities)if(c.owner===u.team&&Math.abs(c.x-u.x)<110&&Math.abs(c.y-u.y)<110){ok=true;break;}
    if(!ok){const hq=getHQ(u.team);if(hq&&hyp(hq.x-u.x,hq.y-u.y)<160)ok=true;}
    if(u.type==='hero'){u.hp=Math.min(maxHp,u.hp+5);continue;}
    if(ok){u.hp=Math.min(maxHp,u.hp+maxHp*.02);if(u.team===1&&G.parts.length<PMAX-50)G.parts.push({x:u.x+rnd(-4,4),y:u.y+rnd(-4,4),z:8,vx:0,vy:0,vz:.35,t:28,T:28,c:'heal'});}
  }
}

function requestPath(u,x,y){
  if(u.d.cls==='air'){u.path=[{x:clamp(x,4,W-4),y:clamp(y,4,H-4)}];u.pi=0;u.pathReq=null;return;}
  u.pathReq={x,y};if(!u.inQ){u.inQ=true;G.pathQ.push(u);}
}
let pathCache=[];
function processPaths(){
  const t0=performance.now();let n=0;
  while(G.pathQ.length&&n<5&&(n<1||performance.now()-t0<7)){
    const u=G.pathQ.shift();u.inQ=false;
    if(u.dead||!u.pathReq)continue;
    const r=u.pathReq,mv=u.d.mv;u.pathReq=null;
    let hit=null;for(const pc of pathCache){if(pc.mv===mv&&G.frame-pc.f<40&&Math.abs(pc.sx-u.x)<52&&Math.abs(pc.sy-u.y)<52&&Math.abs(pc.tx-r.x)<52&&Math.abs(pc.ty-r.y)<52){hit=pc;break;}}
    if(hit&&hit.res&&hit.res.pts.length>1&&pass(cellAt(r.x,r.y),mv)){const pts=hit.res.pts.slice(0,-1);pts.push({x:r.x,y:r.y});u.path=pts;u.pi=0;u.partial=hit.res.partial;continue;}
    const res=findPath(u.x,u.y,r.x,r.y,mv);
    u.path=res?res.pts:null;u.pi=0;u.partial=res?res.partial:true;n++;
    pathCache.push({mv,f:G.frame,sx:u.x,sy:u.y,tx:r.x,ty:r.y,res});if(pathCache.length>10)pathCache.shift();
  }
}
function offsets(n){const o=[[0,0]];let ring=1;while(o.length<n){const m=ring*6;for(let k=0;k<m&&o.length<n;k++){const a=k/m*TAU;o.push([Math.cos(a)*ring,Math.sin(a)*ring]);}ring++;}return o;}
function cmdMove(list,x,y,amove,isQueue){

function board(u,v){
  v.cargo=v.cargo||[];if(v.cargo.length>=(v.d.cap||0))return false;
  v.cargo.push(u.type+'@'+Math.round(u.hp));u.dead=true;u.boarded=true;G.dirty=true;G.sel.delete(u);

}
function unload(v,hurtF){
  if(!v.cargo||!v.cargo.length)return[];const out=[];
  for(const it of v.cargo){const [type,hp]=String(it).split('@');if(!UT[type])continue;
    const j=nearestPassable(cellAt(v.x+rnd(-22,22),v.y+rnd(-22,22)),'land',8);if(j<0)continue;
    const n=addUnit(type,v.team,cxw(j)+rnd(-3,3),cyw(j)+rnd(-3,3));n.hp=Math.max(1,Math.min(n.d.hp,(+hp||n.d.hp)*(hurtF||1)));out.push(n);}

function cmdStop(list){for(const u of list){u.order=null;u.path=null;u.tgt=null;u.pathReq=null;u.queue=[];}}
function nextOrder(u){
  u.path=null;u.pathReq=null;
  if(u.queue&&u.queue.length>0){
    const next=u.queue.shift();
    u.order=next;
    if(next.k==='move'||next.k==='amove'){
      next.n=0;u.tgt=null;u.fail=0;
      requestPath(u,next.x,next.y);
    }else if(next.k==='atk'){
      if(!next.t||next.t.dead){return nextOrder(u);}
      u.tgt=next.t;u.fail=0;u.repT=0;
    }else if(next.k==='patrol'){
      u.tgt=null;u.fail=0;
      requestPath(u,next.pts[next.idx].x,next.pts[next.idx].y);
    }
    return next;
  }
  u.order=null;
  return null;

function findTarget(src,d,range){
  let best=null,bs=1e9;const WM=DM[d.wpn];
  const f=G.frame;
  for(const e of G.units){
    if(e.team===src.team||e.dead||!canHit(d,e))continue;
    if(d.only==='sea'&&e.d.cls!=='sea')continue;
    if(!seenBy(src.team,e))continue;
    if(src.ign&&src.ign[e.id]>f)continue;
    const dd=hyp(e.x-src.x,e.y-src.y)-e.d.r;if(dd>range)continue;
    let sc=(dd+70)/Math.max(.3,WM[e.d.armor]);
    if(src.team>1){
      if(G.hero&&e===G.hero)sc*=.55;
      else if(e.d.role==='arty'||e.d.role==='mlrs')sc*=.65;
      else if(e.d.role==='eng')sc*=.7;
      if(e.hp<e.d.hp*.25)sc*=.6;
    }
    if(sc<bs){bs=sc;best=e;}
  }
  if(d.only!=='sea')for(const e of G.blds){
    if(e.team===src.team||e.dead||!canHit(d,e))continue;
    if(src.team===1&&!seen1(e))continue;
    if(src.ign&&src.ign[e.id]>f)continue;
    const dd=hyp(e.x-src.x,e.y-src.y)-e.hw+90;if(dd>range+90)continue;
    let sc=(dd+70)/Math.max(.3,WM.bld);
    if(src.team>1){
      if(e.type==='hq')sc*=.75;
      else if(e.type==='tower')sc*=.82;
    }
    if(sc<bs){bs=sc;best=e;}
  }
  return best;
}
const elevOf=e=>e.kind==='b'?14:(e.d.cls==='air'?ALT:(e.d.role==='sub'?-1:(e.d.armor==='inf'?5:8)));

function hurt(e,amt,src){

  if(e.kind==='u'&&e.rank)amt*=(1-(e.rank===2?0.25:0.10));
  if(src&&e.kind==='u'&&e.d.cls==='land'){const ci=cellAt(e.x,e.y);if(ci>=0&&tFor[ci])amt*=e.d.armor==='inf'?.65:.82;else if(e.d.armor==='inf'){for(const c of G.cities)if(c.owner===e.team&&Math.abs(c.x-e.x)<70&&hyp(c.x-e.x,c.y-e.y)<70){amt*=.8;break;}}}
  e.hp-=amt;e.hitT=G.frame;e.lastHurtT=G.frame;
  if(src&&src.kind==='u'&&!src.dead&&src.team!==e.team)addXP(src,Math.round(amt*0.25));
  if(e.team===1||(src&&src.team===1))G.combatT=G.frame;
  if(src&&!src.dead&&src.team!==e.team)e.lastAtk=src;

function kill(e,src){

function splash(p){

/* ================= CẬP NHẬT ================= */
function updUnit(u){
  const d=u.d;
  if(u.cd>0)u.cd--;
  if(u.tgt&&(u.tgt.dead||!canHit(d,u.tgt)))u.tgt=null;
  let o=u.order;
  if(o&&o.k==='atk'){if(o.t.dead){u.tgt=null;o=nextOrder(u);}else u.tgt=o.t;}
  if(!u.tgt&&(!o||o.k==='amove'||o.k==='patrol')){if(--u.scanT<=0){u.scanT=12+(u.id%6);u.tgt=findTarget(u,d,d.sight);if(u.tgt){u.path=null;u.repT=0;}}}
  if(!u.tgt&&!o&&u.lastAtk&&!u.lastAtk.dead&&canHit(d,u.lastAtk)&&hyp(u.x-u.lastAtk.x,u.y-u.lastAtk.y)<d.sight+160){u.tgt=u.lastAtk;u.repT=0;}
  u.lastAtk=null;
  let firing=false;
  if(u.tgt&&!(o&&o.k==='move')){
    const t=u.tgt,dd=hyp(t.x-u.x,t.y-u.y)-rad(t),rb=(d.cls==='land'&&!(t.kind==='u'&&t.d.cls==='air'))?1+clamp((groundY(u.x,u.y)-groundY(t.x,t.y))/130,0,.3):1;
    if(dd<=d.rng*rb){
      u.path=null;u.fail=0;firing=true;
      const ang=Math.atan2(t.y-u.y,t.x-u.x);
      if(d.turret){u.ta=turn(u.ta,ang,.12);}else{u.a=turn(u.a,ang,.25);u.ta=u.a;}
      if(u.cd<=0&&Math.abs(angD(u.ta,ang))<.3){
        fire(u,d,t);
        const cdMult=u.rank===2?0.65:u.rank===1?0.85:1;
        if(d.burst){u.bn=(u.bn||0)+1;if(u.bn>=d.burst){u.bn=0;u.cd=d.cd*cdMult;}else u.cd=9*cdMult;}else u.cd=d.cd*cdMult*rnd(.92,1.08);
      }
    }else{
      const leash=(o&&o.k==='atk')?1e9:d.sight+180;
      if(dd>leash){u.tgt=null;}
      else{
        if(--u.repT<=0||(!u.path&&!u.pathReq)){
          if(u.path===null&&u.partial&&u.repT<=0&&u.lastChase===t.id){u.fail++;}
          if(u.fail>3){u.ign[t.id]=G.frame+900;u.tgt=null;u.fail=0;if(o&&o.k==='atk')o=nextOrder(u);}
          else{u.repT=45+(u.id%20);u.lastChase=t.id;requestPath(u,t.x,t.y);}
        }
      }
    }
  }
  if(o&&o.k==='board'){
    const v=o.t;
    if(v.dead||v.team!==u.team||(v.cargo||[]).length>=(v.d.cap||0)){o=nextOrder(u);}
    else if(hyp(u.x-v.x,u.y-v.y)<v.d.r+18){board(u,v);return;}
    else if(!u.path&&!u.pathReq){o.n=(o.n||0)+1;if(o.n>40)o=nextOrder(u);else requestPath(u,v.x,v.y);}
  }
  if(o&&o.k==='tunnel'){
    if(o.a.dead||o.b.dead){o=nextOrder(u);}
    else if(hyp(u.x-o.a.x,u.y-o.a.y)<o.a.hw+34){

function follow(u){

/* Tách các đơn vị chồng lên nhau. Dùng lưới băm không gian (ô = 1,8 × bán kính lớn nhất) nên chỉ xét các cặp ở ô kề nhau thay vì mọi cặp O(n²). */
let sepHead=null,sepNext=null,sepCell=null;
function separate(){
  const L=G.units,n=L.length;if(n<2)return;
  let maxR=4;for(let i=0;i<n;i++){const u=L[i];if(!u.dead&&u.d.r>maxR)maxR=u.d.r;}
  const cs=maxR*1.8+.01,gw=Math.max(1,Math.ceil(W/cs)),gh=Math.max(1,Math.ceil(H/cs)),nc=gw*gh;
  if(!sepHead||sepHead.length<nc)sepHead=new Int32Array(nc);
  if(!sepNext||sepNext.length<n){sepNext=new Int32Array(n*2);sepCell=new Int32Array(n*2);}
  sepHead.fill(-1,0,nc);
  for(let i=n-1;i>=0;i--){const u=L[i];if(u.dead){sepCell[i]=-1;continue;}
    const gx=clamp(Math.floor(u.x/cs),0,gw-1),gy=clamp(Math.floor(u.y/cs),0,gh-1),c=gy*gw+gx;sepCell[i]=c;sepNext[i]=sepHead[c];sepHead[c]=i;}
  for(let i=0;i<n;i++){const a=L[i];if(a.dead||sepCell[i]<0)continue;
    const c=sepCell[i],gx=c%gw,gy=(c/gw)|0,xa=Math.max(0,gx-1),xb=Math.min(gw-1,gx+1),ya=Math.max(0,gy-1),yb=Math.min(gh-1,gy+1);
    for(let yy=ya;yy<=yb;yy++)for(let xx=xa;xx<=xb;xx++)
      for(let j=sepHead[yy*gw+xx];j!==-1;j=sepNext[j]){if(j<=i)continue;const b=L[j];if(b.dead)continue;sepPair(a,b);}

}
function sepPair(a,b){
      if((a.d.cls==='air')!==(b.d.cls==='air'))return;
      const r=(a.d.r+b.d.r)*.9,dx=b.x-a.x,dy=b.y-a.y;
      if(Math.abs(dx)>r||Math.abs(dy)>r)return;
      let dl=hyp(dx,dy);if(dl>=r)return;
      let nx,ny;if(dl<.01){const ang=rnd(0,TAU);nx=Math.cos(ang);ny=Math.sin(ang);dl=0;}else{nx=dx/dl;ny=dy/dl;}

      const aIsVeh = (a.d.cls||'land')==='land'&&a.d.armor==='veh';
      const bIsVeh = (b.d.cls||'land')==='land'&&b.d.armor==='veh';
      const aIsInf = (a.d.cls||'land')==='land'&&a.d.armor==='inf';
      const bIsInf = (b.d.cls||'land')==='land'&&b.d.armor==='inf';

      if(aIsVeh && bIsInf && a.team !== b.team){ crushUnit(a, b); return; }
      if(bIsVeh && aIsInf && a.team !== b.team){ crushUnit(b, a); return; }

      const push=(r-dl)*.35;

}

function cmdMoveAI(list,x,y){
  if(!list||!list.length)return;

  list.forEach((u,k)=>{
    const r=u.d.role;
    let tx,ty;
    if(r==='arty'||r==='mlrs'){
      const standoff=Math.min(dist*.75,270);
      tx=x-dirX*standoff+off[k][0]*18;
      ty=y-dirY*standoff+off[k][1]*18;
    }else if(r==='aa'||r==='aainf'){
      const standoff=Math.min(dist*.5,180);
      tx=x-dirX*standoff+off[k][0]*18;
      ty=y-dirY*standoff+off[k][1]*18;
    }else{

      ty=y+off[k][1]*20;
    }
    u.order={k:'amove',x:tx,y:ty,n:0};u.tgt=null;u.fail=0;
    requestPath(u,tx,ty);
  });
}

/* ================= VÒNG LẶP ================= */
function step(){
  G.frame++;
  processPaths();
  for(const u of G.units)if(!u.dead)updUnit(u);
  separate();
  for(const b of G.blds)if(!b.dead)updBld(b);
  updProj();updStrikes();updFx();
  if(G.frame%3===0)updCities();
  for(const t in G.teams)updTeam(+t);
  if(G.frame%60===0){for(const t in G.teams)G.teams[t].credits+=income(+t);checkEnd();}
  if(G.frame%1800===900)saveGame(true);
  for(const t in G.ais)if(G.frame%30===+t*3)ai(+t);
  if(G.frame%30===17)updStakes();
  if(G.frame%12===1)computeFog();
  if(G.frame%30===7)regen();
  if(G.frame%60===13)checkObjectives();
  G.proj=G.proj.filter(p=>!p.dead);
  if(G.dirty){G.dirty=false;G.units=G.units.filter(u=>!u.dead);G.blds=G.blds.filter(b=>!b.dead);
    for(const u of [...G.sel])if(u.dead)G.sel.delete(u);if(G.selB&&G.selB.dead)G.selB=null;
    for(const k in G.groups)G.groups[k]=G.groups[k].filter(u=>!u.dead);}
}
function checkEnd(){
  if(G.over)return;
  for(const t in G.ais){const A=G.ais[t];if(A.dead||getHQ(+t))continue;A.dead=true;toast(tname(t)+' đã bị xóa sổ!','good');sfx('ready');
    for(const u of G.units)if(!u.dead&&u.team===+t)kill(u,null);for(const b of G.blds.slice())if(!b.dead&&b.team===+t)kill(b,null);
    for(const c of G.cities)if(c.owner===+t||c.capT===+t){c.owner=0;c.cap=0;c.capT=0;}}
  if(!getHQ(1))endGame(false);else if(Object.values(G.ais).every(a=>a.dead))endGame(true);
}
function endGame(win){
  G.over=true;if(G.saveId)deleteSave(G.saveId);sfx(win?'ready':'alert');
  const t=fmtTime(G.frame/60),owned=G.cities.filter(c=>c.owner===1).length;
  showCard(`<h1>${win?'Chiến thắng!':'Thất thủ'}</h1>
  <p class="sub">${win?'Mọi thế lực xâm lược đã bị đánh bại. Dải đất chữ S lại yên bình.':'Sở chỉ huy của ta đã bị phá hủy. Hãy củng cố và thử lại.'}</p>
  <p>Thời gian: <b>${t}</b><br>Thành phố đang giữ: <b>${owned}/${G.cities.length}</b><br>Đơn vị đã huấn luyện: <b>${G.stats.built}</b><br>Địch bị tiêu diệt: <b>${G.stats.killed}</b><br>Quân ta tổn thất: <b>${G.stats.lost}</b></p>
  <button class="go" id="againBtn">Chơi ván mới</button>`);
  $('#againBtn').onclick=showStart;
}

function itemClick(k){
  if(!G||G.over)return;
  const T=G.teams[1];
  if(BT[k]){
    if(T.bready===k){G.place=k;G.powerArm=false;G.amove=false;updHint();return;}
    if(T.bready){toast('Hãy đặt '+BT[T.bready].name+' trước','bad');G.place=T.bready;updHint();return;}
    if(T.bq){toast('Đang xây '+BT[T.bq.type].name+'…');return;}
    if(!has(1,BT[k].req)){toast('Cần có '+BT[BT[k].req].name,'bad');return;}
    if(T.credits<BT[k].cost){toast('Không đủ ngân sách','bad');return;}
    T.credits-=BT[k].cost;T.bq={type:k,t:0,T:BT[k].time*60};
    sfx('build_start');
  }else{
    const d=UT[k];
    if(!has(1,d.from)){toast('Cần có '+BT[d.from].name,'bad');return;}
    if(T.pq[d.from].length>=8){toast('Hàng chờ đã đầy','bad');return;}
    if(T.credits<d.cost){toast('Không đủ ngân sách','bad');return;}
    T.credits-=d.cost;T.pq[d.from].push(k);
    const cat=d.from==='barracks'?'inf':d.from==='factory'?'veh':d.from==='airfield'?'air':'ship';
    sfx('order_'+cat);
  }
  refreshItems();
}
function itemCancel(k){

    else if(T.bready===k){T.credits+=BT[k].cost;T.bready=null;G.place=null;updHint();toast('Đã hủy '+BT[k].name);}
  }else{const q=T.pq[UT[k].from],i=q.lastIndexOf(k);if(i>=0){q.splice(i,1);T.credits+=UT[k].cost;if(i===0)T.pt[UT[k].from]=0;}}

}

const fmtTime=s=>{s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function toast(msg,kind){
  const box=$('#toasts');const el=document.createElement('div');el.className='toast'+(kind?' '+kind:'');el.textContent=msg;box.appendChild(el);
  while(box.children.length>4)box.firstChild.remove();
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),450);},2600);
}
function hint(t){const h=$('#modeHint');h.textContent=t;h.style.display=t?'block':'none';}
function updHint(){
  if(!G)return;
  if(G.place)hint('Chọn vị trí đặt '+BT[G.place].name+' trong vòng vàng · chuột phải để hủy');
  else if(G.powerArm)hint('Chọn mục tiêu cho '+NATIONS[G.teams[1].nat].power);
  else if(G.amove)hint('Chọn điểm tiến công');
  else if(G.patrol)hint('Chọn điểm tuần tra (lính sẽ đi tuần và tự bắn địch)');
  else if(G.queueMode)hint('Chế độ Nối lệnh đang bật (chạm để xếp hàng di chuyển)');
  else hint('');
}

const ptrs=new Map();let drag=null,lastTap={t:0,type:null};
function pick(sx,sy,touch){
  let best=null,bd=1e9;const tol=touch?16:8;
  for(const u of G.units){if(u.dead||(u.team!==1&&!vis[cellAt(u.x,u.y)]))continue;const z=groundY(u.x,u.y)+(u.d.cls==='air'?ALT:4);const p=proj(u.x,u.y,z);if(!p.ok)continue;
    const r=u.d.r*pxScale(u.x,u.y,z)+tol,dd=hyp(p.x-sx,p.y-sy);if(dd<r&&dd<bd){bd=dd;best=u;}}
  if(best)return best;
  const g=groundPoint(sx,sy);
  for(const b of G.blds){if(b.dead||(b.team!==1&&!expl[cellAt(b.x,b.y)]))continue;if(g&&Math.abs(b.x-g.x)<b.hw+2&&Math.abs(b.y-g.y)<b.hw+2)return b;}
  for(const b of G.blds){if(b.dead||(b.team!==1&&!expl[cellAt(b.x,b.y)]))continue;const z=heightAt(b.x,b.y)+14,p=proj(b.x,b.y,z);if(p.ok&&hyp(p.x-sx,p.y-sy)<b.hw*pxScale(b.x,b.y,z))return b;}
  return null;
}
function selArmy(){return [...G.sel].filter(u=>!u.dead);}
function tap(sx,sy,right,shift,touch){
  if(!G||G.over)return;
  if(right){if(G.place||G.powerArm||G.amove||G.patrol){G.place=null;G.powerArm=false;G.amove=false;G.patrol=false;}else{G.sel.clear();G.selB=null;}updHint();return;}
  const w=groundPoint(sx,sy);if(!w)return;
  if(G.place){
    const {cx,cy}=placeCell(G.place,w.x,w.y),pd=BT[G.place];
    if(canPlace(1,G.place,cx,cy,false)){addBld(G.place,1,cx,cy);G.teams[1].bready=null;G.place=null;sfx('ready');refreshItems();}
    else toast(pd.dep?(pd.dep==='gold'?'Mỏ vàng phải đặt lên điểm quặng vàng':'Giếng dầu phải đặt lên điểm dầu')+' trong vùng xây dựng của ta (kéo Trụ điện tới nếu ở xa)':pd.coast?pd.name+' phải đặt sát biển, gần căn cứ hoặc thành phố của ta':'Không thể đặt ở đây','bad');
    updHint();return;
  }
  if(G.powerArm==='stake'){
    const ci=cellAt(w.x,w.y);if(ci<0||terr[ci]!==0){toast('Cọc phải đóng dưới nước','bad');return;}
    G.stakes.push({x:w.x,y:w.y,t:90*60,team:1});G.teams[1].stake=0;G.powerArm=false;toast('Đã đóng bãi cọc. Tàu địch đi qua sẽ bị đánh chìm dần.','good');sfx('ready');updHint();return;}
  if(G.powerArm){launchPower(1,w.x,w.y);G.powerArm=false;updHint();return;}
  const e=pick(sx,sy,touch);const sel=selArmy();
  const isQ=shift||!!(G&&G.queueMode);
  if(G.patrol&&sel.length){cmdPatrol(sel,w.x,w.y,isQ);G.patrol=false;updHint();return;}
  if(G.amove&&sel.length){cmdMove(sel,w.x,w.y,true,isQ);G.amove=false;updHint();return;}
  if(e&&e.team===1&&e.kind==='u'&&e.d.cap&&sel.length&&sel.some(u=>u.d.armor==='inf'&&u.d.cls==='land')&&!sel.includes(e)){
    const inf=sel.filter(u=>u.d.armor==='inf'&&u.d.cls==='land'),room=e.d.cap-(e.cargo||[]).length;
    if(room<=0){toast(e.d.name+' đã đầy','bad');return;}
    for(const u of inf.slice(0,room)){u.order={k:'board',t:e,n:0};u.tgt=null;u.queue=[];requestPath(u,e.x,e.y);}
    toast(Math.min(room,inf.length)+' lính lên '+e.d.name+(inf.length>room?' (xe chỉ còn '+room+' chỗ)':''));return;}
  if(e&&e.team===1){
    if(e.kind==='u'){
      const now=performance.now();
      if(now-lastTap.t<350&&lastTap.type===e.type)G.sel=new Set(G.units.filter(u=>!u.dead&&u.team===1&&u.type===e.type&&onScreen(u.x,u.y,0)));
      else if(shift){G.sel.has(e)?G.sel.delete(e):G.sel.add(e);}
      else G.sel=new Set([e]);
      lastTap={t:now,type:e.type};G.selB=null;sfx('select_unit');unitVoice('select');
    }else if(sel.length&&e.type==='tunnel'&&G.blds.some(b=>!b.dead&&b.team===1&&b.type==='tunnel'&&b!==e)){
      const tn=G.blds.filter(b=>!b.dead&&b.team===1&&b.type==='tunnel'&&b!==e);let n=0;
      for(const u of sel){if(u.d.cls!=='land')continue;let A=null,bd=1e9;for(const b of tn){const dd=hyp(b.x-u.x,b.y-u.y);if(dd<bd){bd=dd;A=b;}}
        u.order={k:'tunnel',a:A,b:e,n:0};u.tgt=null;requestPath(u,A.x,A.y+A.hw+12);n++;}
      if(n){toast('Hành quân qua địa đạo');G.fx.push({k:'ring',x:e.x,y:e.y,t:30,T:30,c:'#c9a15a'});}
    }else{if(sel.length)cmdMove(sel,w.x,w.y,false,isQ);else G.selB=e;}
    return;
  }
  if(e&&e.team!==1){if(sel.length)cmdAttack(sel,e,isQ);else G.selB=e;return;}
  if(sel.length)cmdMove(sel,w.x,w.y,false,isQ);
  else if(G.selB&&!G.selB.dead&&G.selB.team===1&&CATS.includes(G.selB.type)){G.selB.rally={x:w.x,y:w.y};G.fx.push({k:'ring',x:w.x,y:w.y,t:24,T:24,c:'#ffd23f'});toast('Đã đặt điểm tập kết cho '+G.selB.d.name);}
  else G.selB=null;
}
function boxSelect(x1,y1,x2,y2,shift){
  const ax=Math.min(x1,x2),ay=Math.min(y1,y2),bx=Math.max(x1,x2),by=Math.max(y1,y2);
  const list=G.units.filter(u=>{if(u.dead||u.team!==1)return false;const p=proj(u.x,u.y,groundY(u.x,u.y)+(u.d.cls==='air'?ALT:3));return p.ok&&p.x>=ax&&p.x<=bx&&p.y>=ay&&p.y<=by;});
  if(!shift)G.sel=new Set();list.forEach(u=>G.sel.add(u));if(list.length){G.selB=null;sfx('select_unit');unitVoice('select');}
}

cv.addEventListener('pointerdown',e=>{
  ensureAudio();if(!camera)return;if(G)G.introT=0;

  if(ptrs.size===1)drag={id:e.pointerId,sx:e.offsetX,sy:e.offsetY,x:e.offsetX,y:e.offsetY,btn:e.button,touch:e.pointerType!=='mouse',kind:'none',yaw0:cam.yaw,g0:planePoint(e.offsetX,e.offsetY),shift:e.shiftKey};

cv.addEventListener('pointermove',e=>{
  if(G)G.mouse={sx:e.offsetX,sy:e.offsetY,in:true,mouse:e.pointerType==='mouse'};
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(!drag)return;
  if(drag.kind==='pinch'){if(ptrs.size>=2){const [p1,p2]=[...ptrs.values()];const d=hyp(p1.x-p2.x,p1.y-p2.y),a=Math.atan2(p2.y-p1.y,p2.x-p1.x);
    cam.dist=drag.dist0*Math.max(10,drag.d0)/Math.max(10,d);cam.yaw=drag.yaw0-angD(drag.a0,a);clampCam();}return;}
  if(e.pointerId!==drag.id)return;
  drag.x=e.offsetX;drag.y=e.offsetY;
  if(drag.kind==='none'&&hyp(drag.x-drag.sx,drag.y-drag.sy)>(drag.touch?10:6)){
    if(!drag.touch)drag.kind=drag.btn===0?'box':drag.btn===1?'rot':'pan';
    else drag.kind=G&&G.boxMode?'box':'pan';
    if(G&&(G.place||G.powerArm)&&drag.kind==='box')drag.kind='pan';
  }
  if(drag.kind==='pan'&&drag.g0){updateCamera();const g=planePoint(drag.x,drag.y);if(g){cam.tx+=drag.g0.x-g.x;cam.ty+=drag.g0.y-g.y;clampCam();updateCamera();}}
  else if(drag.kind==='rot'){cam.yaw=drag.yaw0-(drag.x-drag.sx)*.008;}
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);
  if(drag&&drag.id===e.pointerId){
    if(drag.kind==='none')tap(drag.sx,drag.sy,drag.btn===2,e.shiftKey||drag.shift,drag.touch);
    else if(drag.kind==='box'&&G)boxSelect(drag.sx,drag.sy,drag.x,drag.y,e.shiftKey||drag.shift);
  }
  if(ptrs.size===0)drag=null;
}

const keys=new Set();
window.addEventListener('keydown',e=>{

  if(k==='escape'){G.place=null;G.powerArm=false;G.amove=false;G.patrol=false;G.queueMode=false;G.sel.clear();updHint();}
  else if(k==='a'&&!e.ctrlKey&&!e.metaKey){if(selArmy().length){G.amove=!G.amove;G.patrol=false;updHint();}}

  }
});

let AC=null,muted=false,noiseBuf=null;const lastS={};
function ensureAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();noiseBuf=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);}catch(e){AC=null;}}
let musicOn=true,musicT=0,mStep=0;const SCALE=[293.66,349.23,392,440,523.25,587.33,698.46];
function pluck(f,t,dur,vol,type){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.05);}
function music(){
  if(!AC||muted||!musicOn||!G||G.paused||G.over)return;const now=AC.currentTime;if(now<musicT)return;
  const tense=G.frame-G.combatT<480,beat=tense?.28:.52;musicT=now+beat;mStep++;
  try{
    if(mStep%8===1)pluck(SCALE[0]/2,now,1.6,.05,'sine');
    if(mStep%8===5)pluck(SCALE[3]/2,now,1.2,.035,'sine');
    if(Math.random()<(tense?.8:.55)){const n=SCALE[(Math.random()*SCALE.length)|0];pluck(n,now,tense?.45:1.2,.03,'triangle');if(Math.random()<.25)pluck(n*1.5,now+beat/2,.7,.018,'triangle');}
    if(tense&&mStep%2===0&&noiseBuf){const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=mStep%4===0?140:320;const g=AC.createGain();g.gain.setValueAtTime(.09,now);g.gain.exponentialRampToValueAtTime(.001,now+.18);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(now);s.stop(now+.2);}
  }catch(e){}
}
function sfx(k){
  if(muted||!AC)return;const now=AC.currentTime;
  const gap={shot:.06,shot_cannon:.1,shot_rocket:.09,shot_mg:.04,boom:.1,strike:.4,crush:.12,click:.04,select_unit:.05,cmd_move:.07,cmd_attack:.07,order_inf:.1,order_veh:.1,order_air:.1,order_ship:.1,build_start:.1,unit_inf_ready:.3,unit_veh_ready:.3,unit_air_ready:.3,unit_ship_ready:.4,capture:.4,ready:.2,alert:1.2}[k]||.08;
  if(lastS[k]&&now-lastS[k]<gap)return;lastS[k]=now;
  try{
    const g=AC.createGain();g.connect(AC.destination);
    if(k==='boom'||k==='strike'){
      const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();
      f.type='lowpass';f.frequency.value=k==='strike'?900:500;s.connect(f);f.connect(g);
      g.gain.setValueAtTime(k==='strike'?.35:.13,now);g.gain.exponentialRampToValueAtTime(.001,now+(k==='strike'?.9:.45));
      s.start(now);s.stop(now+1);return;
    }

        g.gain.setValueAtTime(.32,now);g.gain.exponentialRampToValueAtTime(.001,now+.28);

      o.frequency.setValueAtTime(140,now);o.frequency.exponentialRampToValueAtTime(32,now+.24);
      g2.gain.setValueAtTime(.22,now);g2.gain.exponentialRampToValueAtTime(.0001,now+.25);

const HELP=`<ul class="help">
<li><b>Chọn quân:</b> chạm hoặc nhấp vào quân ta; kéo chuột trái để chọn vùng; nhấp đúp để chọn mọi đơn vị cùng loại trên màn hình.</li>
<li><b>Ra lệnh & Đi tuần:</b> chạm lên mặt đất để di chuyển, lên quân địch để tấn công. Nút ⚔ (phím A) để tiến công. Nút 🔄 (phím T) để đi tuần tra qua lại giữa 2 điểm và tự bắn địch. Giữ phím <b>Shift</b> hoặc bật nút <b>⛓ Nối lệnh</b> để xếp hàng các điểm đến theo thứ tự 1, 2, 3...</li>
<li><b>Góc nhìn:</b> kéo một ngón (hoặc kéo chuột phải, phím mũi tên, đưa chuột ra mép) để cuộn; chụm hai ngón hoặc lăn chuột để phóng to; xoay hai ngón, kéo chuột giữa, phím Z/X hoặc nút ⟲ ⟳ để xoay; R quay về hướng Bắc.</li>
<li><b>Kinh tế:</b> Sở chỉ huy +6, mỗi Trạm tiếp tế +7, Mỏ vàng +12, Giếng dầu +9, mỗi điểm chiếm được +4 ngân sách mỗi giây. Mỏ vàng chỉ đặt lên điểm quặng vàng (chấm vàng trên bản đồ), Giếng dầu lên điểm dầu (chấm đen); mỗi giếng dầu còn tăng 10% tốc độ sản xuất xe, máy bay, tàu.</li>
<li><b>Điện:</b> ⚡ trên thanh trên cùng là điện đang dùng / đang cấp. Sở chỉ huy cấp 10, mỗi Nhà máy điện cấp 25. Thiếu điện thì xây dựng, sản xuất và vũ khí công trình chậm lại, radar tắt. Trụ điện cao thế kéo vùng xây dựng đi xa để vươn tới mỏ ở xa.</li>
<li><b>Xe chở quân:</b> chọn lính bộ rồi chạm vào xe thiết giáp chở quân của ta để lên xe (tối đa 5); chọn xe rồi bấm 🚪 Thả quân (phím U). Xe bị phá thì lính nhảy ra, bị thương.</li>
<li><b>Xây dựng:</b> chọn công trình, đợi xây xong rồi đặt trong vòng vàng quanh căn cứ hoặc điểm đã chiếm. Xưởng đóng tàu phải sát sông, biển.</li>
<li><b>Địa hình:</b> đi trên đường nhanh hơn hẳn; rừng che chắn cho bộ binh nhưng làm xe chậm; sườn núi dốc thì xe không lên được, phải theo đường đèo; đứng trên cao bắn xuống mạnh hơn, xa hơn và nhìn xa hơn; ruộng trũng và tuyết làm xe chậm. Rê chuột lên bản đồ để xem loại địa hình.</li>
<li><b>Sông và cầu:</b> quân bộ chỉ qua sông ở cầu và bến phà. Giữ cầu là giữ được cả một bờ. Tàu chiến chạy được trên sông lớn.</li>
<li><b>Khắc chế:</b> rê chuột vào từng đơn vị để xem mạnh với gì, yếu với gì. Tổ chống tăng diệt xe, tên lửa vác vai và xe phòng không diệt máy bay, xe chiến đấu bộ binh quét bộ binh, pháo đánh công trình.</li>
<li><b>Sương mù:</b> chỉ thấy địch trong tầm nhìn của quân, công trình và điểm của ta.</li>
<li><b>Thăng cấp và hồi máu:</b> hạ 3 rồi 8 địch để lên ★ và ★★. Quân hồi máu khi đứng gần điểm của ta; công binh sửa xe và công trình.</li>
<li><b>Lưu ván:</b> mỗi ván có một ô lưu riêng, tự lưu mỗi 30 giây và khi bạn mở trình đơn hoặc rời trang; nút 💾 để lưu ngay. Màn hình đầu liệt kê mọi ván đã lưu (tối đa 12) để chọn Chơi tiếp hoặc Xóa. Ván lưu nằm trong trình duyệt này, trên máy này.</li>
<li><b>Phím tắt & Mobile:</b> Q chọn toàn quân, S dừng, U thả quân khỏi xe, T đi tuần, A tấn công, Space về căn cứ, Ctrl+1–9 lưu nhóm, 1–9 gọi nhóm, P tạm dừng. Trên điện thoại: nút 🏭 cho phép thu gọn/mở rộng bảng sản xuất để quan sát chiến trường toàn màn hình.</li>
<li><b>Thắng:</b> phá hủy Sở chỉ huy của mọi đối thủ. <b>Thua:</b> mất Sở chỉ huy của ta.</li>
</ul>`;

function drawPreview(cv,m){
  const g=cv.getContext('2d'),w=cv.width,h=cv.height,[x0,x1,y0,y1]=m.box,mw=(x1-x0)*m.kx,mh=y1-y0,s=Math.min(w/mw,h/mh),ox=(w-mw*s)/2,oy=(h-mh*s)/2,p=(lon,lat)=>[ox+(lon-x0)*m.kx*s,oy+(y1-lat)*s];
  const T=THEMES[m.theme],rgb=a=>'rgb('+a.map(Math.round).join(',')+')',poly=(pts)=>{g.beginPath();pts.forEach((q,i)=>{const [x,y]=p(q[0],q[1]);i?g.lineTo(x,y):g.moveTo(x,y);});g.closePath();};
  g.fillStyle='#1b1410';g.fillRect(0,0,w,h);g.save();g.beginPath();g.rect(ox,oy,mw*s,mh*s);g.clip();
  g.fillStyle=m.base==='land'?rgb(T.g):rgb(T.sea1);g.fillRect(0,0,w,h);
  for(const a of m.areas||[]){g.fillStyle=a.t===0?rgb(T.sea1):a.t===1?rgb(T.g):rgb(T.blk);poly(a.poly);g.fill();}
  g.strokeStyle=rgb(T.sea1.map((v,i)=>(v+T.sea0[i])/2));g.lineCap='round';g.lineJoin='round';
  for(const r of m.rivers||[]){g.lineWidth=r.w?Math.max(1.6,r.w*s/(m.ppd)*1.4):.8;g.beginPath();r.pts.forEach((q,i)=>{const [x,y]=p(q[0],q[1]);i?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();}
  for(const q of m.hills||[]){const [x,y]=p(q.at[0],q.at[1]);g.fillStyle='rgba(60,90,50,.5)';g.beginPath();g.arc(x,y,Math.max(2,q.r/m.ppd*s*.9),0,TAU);g.fill();}
  for(const c of m.cities){const [x,y]=p(c[1],c[2]);g.fillStyle=m.starts.includes(c[0])?'#e0302a':'#fff';g.strokeStyle='#1b1410';g.lineWidth=1;g.beginPath();g.arc(x,y,c[3]?3:2,0,TAU);g.fill();g.stroke();}
  g.restore();
}

let arsenalRenderer=null,arsenalScene=null,arsenalCamera=null;
let arsenalAnimId=null,arsenalModelGroup=null,arsenalUnitObj=null;
let a3dYaw=0.65,a3dPitch=0.38,a3dDist=48,a3dTargetDist=48,a3dTargetY=6,a3dDefDist=48,a3dOutl=.3;
let a3dAutoSpin=true;

function stopArsenalViewer(){
  if(arsenalAnimId){cancelAnimationFrame(arsenalAnimId);arsenalAnimId=null;}
  if(arsenalRenderer){try{arsenalRenderer.dispose();}catch(e){}arsenalRenderer=null;}
  arsenalScene=null;arsenalCamera=null;arsenalModelGroup=null;arsenalUnitObj=null;
}

/* Đưa mô hình lên bệ xoay: chuẩn hóa kích thước theo khối bao (lính nhỏ hay tàu dài đều vừa khung),
   đặt đáy lên bệ (máy bay lơ lửng) và tính khoảng cách camera theo góc nhìn để luôn thấy trọn mô hình. */
function loadArsenalModel(nat,role){
  if(!arsenalModelGroup)return;
  while(arsenalModelGroup.children.length>0){arsenalModelGroup.remove(arsenalModelGroup.children[0]);}
  arsenalUnitObj=null;
  const key=nat+'_'+role,d=UT[key];if(!d)return;
  const o=makeUnitObj({team:1,type:role,d,noWorld:true});
  if(!o||!o.g)return;
  arsenalUnitObj=o;if(o.ring&&o.ring.parent)o.ring.parent.remove(o.ring);
  const box=new THREE.Box3().setFromObject(o.g),size=box.getSize(new THREE.Vector3());
  const air=d.cls==='air',fit=air?30:32,sc=fit/Math.max(size.x,size.z,size.y*1.4,.001);
  o.g.scale.setScalar(sc);
  const c=box.getCenter(new THREE.Vector3());
  o.g.position.set(-c.x*sc,(air?5:.6)-box.min.y*sc,-c.z*sc);
  arsenalModelGroup.add(o.g);
  const h=size.y*sc,r=.5*Math.hypot(size.x*sc,h,size.z*sc);
  a3dTargetY=(air?5:.6)+h*.45;
  a3dDefDist=a3dTargetDist=Math.max(22,r/Math.sin(THREE.MathUtils.degToRad(arsenalCamera?arsenalCamera.fov/2:19))*1.12);
  a3dOutl=.35/sc;
}

function initArsenalViewer(canvas){
  stopArsenalViewer();
  if(!canvas||!window.THREE)return;
  const w=canvas.clientWidth||460,h=canvas.clientHeight||290;
  canvas.width=Math.round(w*Math.min(window.devicePixelRatio||1,2));
  canvas.height=Math.round(h*Math.min(window.devicePixelRatio||1,2));
  try{
    arsenalRenderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
    arsenalRenderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    arsenalRenderer.setSize(w,h,false);
  }catch(e){console.warn('arsenalRenderer failed:',e);return;}

  arsenalScene=new THREE.Scene();
  arsenalCamera=new THREE.PerspectiveCamera(38,w/h,1,1000);

  const hemi=new THREE.HemisphereLight(0xffffff,0x8a7a5a,.85);arsenalScene.add(hemi);
  const sunLight=new THREE.DirectionalLight(0xfff5e6,1.15);sunLight.position.set(30,50,40);arsenalScene.add(sunLight);
  const rimLight=new THREE.DirectionalLight(0xffe2b0,.55);rimLight.position.set(-35,25,-35);arsenalScene.add(rimLight);
  const fillLight=new THREE.DirectionalLight(0xffffff,.35);fillLight.position.set(0,-20,20);arsenalScene.add(fillLight);

  const turntable=new THREE.Group();
  const baseMesh=new THREE.Mesh(new THREE.CylinderGeometry(24,25.5,1.2,48),new THREE.MeshLambertMaterial({color:0x7a5a3a}));
  baseMesh.position.y=-0.6;turntable.add(baseMesh);
  const ringMesh=new THREE.Mesh(new THREE.RingGeometry(23.2,24.2,48),new THREE.MeshBasicMaterial({color:0xa8201a,side:THREE.DoubleSide}));
  ringMesh.rotation.x=-Math.PI/2;ringMesh.position.y=0.02;turntable.add(ringMesh);
  const plateMesh=new THREE.Mesh(new THREE.CircleGeometry(23,48),new THREE.MeshLambertMaterial({color:0xd9c9a6}));
  plateMesh.rotation.x=-Math.PI/2;plateMesh.position.y=0.01;turntable.add(plateMesh);
  const innerRingMesh=new THREE.Mesh(new THREE.RingGeometry(11.5,11.9,36),new THREE.MeshBasicMaterial({color:0xb9841a,transparent:true,opacity:.6,side:THREE.DoubleSide}));
  innerRingMesh.rotation.x=-Math.PI/2;innerRingMesh.position.y=0.03;turntable.add(innerRingMesh);
  arsenalScene.add(turntable);

  arsenalModelGroup=new THREE.Group();
  arsenalScene.add(arsenalModelGroup);

  loadArsenalModel(cfg.nat,currentViewerRole);

  let isDown=false,downX=0,downY=0;
  canvas.onpointerdown=e=>{isDown=true;downX=e.clientX;downY=e.clientY;try{canvas.setPointerCapture(e.pointerId);}catch(err){}};
  canvas.onpointermove=e=>{
    if(!isDown)return;
    const dx=e.clientX-downX,dy=e.clientY-downY;
    downX=e.clientX;downY=e.clientY;
    a3dYaw+=dx*0.008;
    a3dPitch=Math.max(0.05,Math.min(1.25,a3dPitch+dy*0.006));
  };
  canvas.onpointerup=canvas.onpointercancel=e=>{isDown=false;try{canvas.releasePointerCapture(e.pointerId);}catch(err){}};
  canvas.onwheel=e=>{e.preventDefault();a3dTargetDist=Math.max(a3dDefDist*.45,Math.min(a3dDefDist*2.2,a3dTargetDist*(1+e.deltaY*0.0012)));};

  let touchStartDist=0;
  canvas.addEventListener('touchstart',e=>{
    if(e.touches.length===2){touchStartDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
  },{passive:true});
  canvas.addEventListener('touchmove',e=>{
    if(e.touches.length===2){
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      if(touchStartDist>0){const f=touchStartDist/d;a3dTargetDist=Math.max(a3dDefDist*.45,Math.min(a3dDefDist*2.2,a3dTargetDist*f));touchStartDist=d;}
    }
  },{passive:true});

  function aLoop(now){
    arsenalAnimId=requestAnimationFrame(aLoop);
    if(a3dAutoSpin&&!isDown)a3dYaw+=0.007;
    a3dDist+=(a3dTargetDist-a3dDist)*0.12;
    const cd=a3dDist*Math.cos(a3dPitch);
    arsenalCamera.position.x=cd*Math.sin(a3dYaw);
    arsenalCamera.position.y=a3dTargetY+a3dDist*Math.sin(a3dPitch);
    arsenalCamera.position.z=cd*Math.cos(a3dYaw);
    arsenalCamera.lookAt(0,a3dTargetY,0);

    if(arsenalUnitObj){
      if(arsenalUnitObj.spins)for(const sp of arsenalUnitObj.spins)sp.m.rotation[sp.ax]+=sp.sp*0.22;
      if(arsenalUnitObj.turret&&!isDown)arsenalUnitObj.turret.rotation.y=Math.sin(now*0.0008)*0.18;
    }
    const ol=OUTL.value;OUTL.value=a3dOutl;   // viền mảnh theo tỉ lệ mô hình (OUTL dùng chung với bản đồ)
    arsenalRenderer.render(arsenalScene,arsenalCamera);OUTL.value=ol;
  }
  arsenalAnimId=requestAnimationFrame(aLoop);
}

function selectArsenalUnit(role){
  currentViewerRole=role;
  document.querySelectorAll('#arsenalTabs .arsenal-tab').forEach(b=>{b.classList.toggle('on',b.dataset.role===role);});
  const u=UT[cfg.nat+'_'+role],meta=ROLE_META[role]||{icon:'🪖',cat:role};
  if(u){
    const curNameEl=$('#a3dCurName');if(curNameEl)curNameEl.textContent=u.name;
    const curRoleEl=$('#a3dCurRole');if(curRoleEl)curRoleEl.textContent=meta.cat;
    const specsEl=$('#arsenalSpecs');if(specsEl)specsEl.innerHTML=renderUnitSpecs(cfg.nat,role);
    loadArsenalModel(cfg.nat,role);
  }
}
function showStart(){
  if(G)G.paused=true;
  const m=MAPS[cfg.map],na=NATIONS[cfg.nat];
  const mapCards=MAP_ORDER.map(id=>`<button class="pick${cfg.map===id?' on':''}" data-k="map" data-v="${id}"><canvas width="300" height="200" data-map="${id}"></canvas><b>${MAPS[id].name}</b><span class="tag">${MAPS[id].tag}</span></button>`).join('');
  const natCards=NAT_ORDER.map(id=>`<button class="pick natpick${cfg.nat===id?' on':''}" data-k="nat" data-v="${id}"><img src="${flagURL(id)}" alt=""><span><b>${NATIONS[id].name}</b><br><small>${NATIONS[id].u.mbt.n} · ${NATIONS[id].u.heli.n} · ${NATIONS[id].u.jet.n}</small></span></button>`).join('');
  const opts=['rand',...NAT_ORDER].map(id=>`<option value="${id}">${id==='rand'?'Ngẫu nhiên':NATIONS[id].name}</option>`).join('');
  const slots=[0,1,2].slice(0,cfg.n).map(i=>`<label class="slot"><i style="background:${TC[i+2].m}"></i>Đối thủ ${i+1}<select data-ai="${i}">${opts.replace('value="'+cfg.ai[i]+'"','value="'+cfg.ai[i]+'" selected')}</select></label>`).join('');
  const roster=RORDER.filter(r=>na.u[r]).map(r=>na.u[r].n).join(' · ');
  const saves=saveList(),cur=G&&!G.over?G.saveId:null;
  const savesHTML=saves.length?`<h3>Ván đã lưu (${saves.length})</h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">${saves.map(m=>`<div class="pick natpick" style="cursor:default${m.id===cur?';border-color:var(--ok)':''}"><img src="${flagURL(m.nat)}" alt=""><span style="flex:1;min-width:0"><b>${MAPS[m.map].name}</b><br><small>${NATIONS[m.nat].name} · ${m.n} đối thủ · ${DIFF[m.diff].label}<br>Đã chơi ${fmtTime(m.frame/60)}${m.tot?' · giữ '+m.own+'/'+m.tot+' điểm':''}<br>${m.id===cur?'Đang chơi':'Lưu lúc '+new Date(m.time).toLocaleString('vi-VN')}</small><br><button class="choice" data-load="${m.id}" style="margin-top:6px;padding:5px 10px;font-size:12.5px">${m.id===cur?'Quay lại':'Chơi tiếp'}</button> <button class="choice" data-del="${m.id}" style="margin-top:6px;padding:5px 10px;font-size:12.5px">Xóa</button></span></div>`).join('')}</div>`:'';
  showCard(`<h1>Lá Chắn Rồng</h1>
  <p class="sub">Tập trận giả tưởng: 7 chiến trường, 8 quốc gia, đánh với máy.</p>${savesHTML}
  <h3>1 · Chiến trường</h3><div class="grid">${mapCards}</div>
  <div class="desc"><b>${m.name}.</b> ${m.desc}</div>
  <h3>2 · Quốc gia của bạn</h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${natCards}</div>
  ${arsenalHTML(cfg.nat)}
  <h3>3 · Đối thủ</h3>
  <div class="choices">${[1,2,3].map(n=>`<button class="choice${cfg.n===n?' on':''}" data-k="n" data-v="${n}">${n} đối thủ</button>`).join('')}</div>
  <div class="choices" style="margin-top:8px">${slots}</div>
  <h3>4 · Vị trí xuất phát</h3>
  <div class="choices">${m.starts.map((s,i)=>`<button class="choice${cfg.start===i?' on':''}" data-k="start" data-v="${i}">${s}</button>`).join('')}</div>
  <h3>5 · Độ khó của máy</h3>
  <div class="choices">${['easy','normal','hard'].map(k=>`<button class="choice${cfg.diff===k?' on':''}" data-k="diff" data-v="${k}">${DIFF[k].label}</button>`).join('')}</div>
  <h3>6 · Đồ họa</h3>${gfxHTML()}
  <button class="go" id="goBtn">Xuất quân</button>${G&&!G.over?'<button class="go alt" id="backBtn">Quay lại trận đang đánh</button>':''}
  <details><summary>Cách chơi</summary>${HELP}</details>
  <p style="margin-top:14px;font-size:12px;color:var(--muted)">Đây là trò chơi giả tưởng. Tên vũ khí là tên thật, còn chỉ số được cân chỉnh cho dễ chơi chứ không phản ánh tính năng thực tế.</p>`);
  document.querySelectorAll('#card canvas[data-map]').forEach(c=>drawPreview(c,MAPS[c.dataset.map]));
  initArsenalViewer($('#arsenalCanvas'));
  const card=$('#card');
  card.onclick=e=>{
    const rb=e.target.closest('[data-role]');
    if(rb){selectArsenalUnit(rb.dataset.role);return;}
    const rst=e.target.closest('#a3dReset');
    if(rst){a3dYaw=0.65;a3dPitch=0.38;a3dTargetDist=a3dDefDist;return;}
    const spn=e.target.closest('#a3dSpin');
    if(spn){a3dAutoSpin=!a3dAutoSpin;spn.classList.toggle('on',a3dAutoSpin);return;}
    const gb=e.target.closest('[data-g]');
    if(gb){const k=gb.dataset.g,v=gb.dataset.v;
      if(k==='mode'){gfx.mode=v;gfx.ceiling=LADDER.length-1;gfx.rung=LADDER.findIndex(([t,s])=>t===(v==='auto'?gfx.detected:v)&&s===1);[gfx.tier,gfx.scale]=LADDER[gfx.rung];applyGfx();}
      else if(k==='cap')gfx.fpsCap=+v;else if(k==='fps')gfx.showFps=!gfx.showFps;
      saveGfx();const y=$('#overlay').scrollTop;showStart();$('#overlay').scrollTop=y;return;}
    const ld=e.target.closest('[data-load]'),dl=e.target.closest('[data-del]');
    if(ld){const id=ld.dataset.load;if(id===cur){hideCard();G.paused=false;return;}const sv=readSave(id);if(!sv){deleteSave(id);showStart();return;}
      ensureAudio();showCard('<h1 style="font-size:30px">Đang tải lại ván chơi…</h1>');
      setTimeout(()=>{try{loadGame(sv);hideCard();}catch(err){console.error(err);deleteSave(id);showCard('<h1 style="font-size:30px">Ván đã lưu bị hỏng</h1><p>Không tải lại được nên đã xóa ván này.</p><button class="go" id="againBtn">Quay lại</button>');$('#againBtn').onclick=showStart;}},60);return;}
    if(dl){const id=dl.dataset.del;if(id===cur)G.saveId=null;deleteSave(id);const y=$('#overlay').scrollTop;showStart();$('#overlay').scrollTop=y;return;}
    const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k,v=b.dataset.v;cfg[k]=(k==='n'||k==='start')?+v:v;if(k==='map')cfg.start=0;const y=$('#overlay').scrollTop;showStart();$('#overlay').scrollTop=y;};
  card.onchange=e=>{const s=e.target.closest('select[data-ai]');if(s)cfg.ai[+s.dataset.ai]=s.value;};
  $('#goBtn').onclick=()=>{ensureAudio();const nats=[cfg.nat];const pool=NAT_ORDER.filter(n=>n!==cfg.nat);
    for(let i=0;i<cfg.n;i++){let v=cfg.ai[i];if(v==='rand'){const left=pool.filter(n=>!nats.includes(n));v=(left.length?left:pool)[(Math.random()*(left.length||pool.length))|0];}nats.push(v);}
    showCard('<h1 style="font-size:30px">Đang dựng chiến trường '+MAPS[cfg.map].name+'…</h1><p>Vẽ địa hình, sông ngòi, cầu và thành phố.</p>');
    setTimeout(()=>{try{newGame(cfg.map,cfg.start,cfg.diff,nats);hideCard();}catch(err){console.error(err);showCard('<h1 style="font-size:30px">Không dựng được chiến trường</h1><p>'+String(err&&err.message||err)+'</p><button class="go" id="againBtn">Quay lại</button>');$('#againBtn').onclick=showStart;}},60);};
  const bb=$('#backBtn');if(bb)bb.onclick=()=>{hideCard();G.paused=false;};

}
/* ================= CHẠY ================= */
function resize(){const r=$('#view').getBoundingClientRect();vw=Math.max(50,r.width);vh=Math.max(50,r.height);dpr=Math.min(TIERS[gfx.tier].hudPr,window.devicePixelRatio||1);
  hud.width=Math.round(vw*dpr);hud.height=Math.round(vh*dpr);
  if(renderer){renderer.setSize(vw,vh,false);camera.aspect=vw/vh;camera.updateProjectionMatrix();}clampCam();}
let last=performance.now(),acc=0,fc=0,ovWas=true;const ovEl=$('#overlay');
function loop(now){
  requestAnimationFrame(loop);
  if(gfx.fpsCap&&now-perf.lastDraw<1000/gfx.fpsCap-1.5)return;   // giới hạn khung hình (tiết kiệm pin / máy nóng)
  const t0=performance.now(),rawDt=now-perf.lastDraw;perf.lastDraw=now;
  const dt=Math.min(100,now-last);last=now;fc++;
  const ov=!ovEl.classList.contains('hide');   // bảng menu che gần kín màn hình: không cần vẽ 3D phía sau
  if(G&&!G.paused&&!G.over){acc+=dt*G.speed;let n=0;while(acc>=1000/60&&n<8){step();acc-=1000/60;n++;}if(n>=8)acc=0;}
  scrollCam(dt);music();
  if(G&&G.introT>0&&!G.paused){G.introT--;cam.dist+=(560-cam.dist)*.05;}
  if(G&&(G.place||G.powerArm)&&G.mouse&&G.mouse.in&&camera)G.mg=groundPoint(G.mouse.sx,G.mouse.sy);else if(G)G.mg=null;
  if(ov!==ovWas){ovWas=ov;perf.lastAdj=now+1500;perf.ema=1000/60;perf.goodT=0;perf.trialRung=-1;pwN=0;}
  if(!ov){
    render3D();drawHud();
    if(fc%5===0)drawMini();
    perfTick(now,Math.min(250,rawDt),performance.now()-t0);
  }
  if(fc%15===0)drawFps();
  if(fc%8===0){refreshTop();refreshItems();updHint();
    const tt=$('#terrTip');if(G&&G.mouse&&G.mouse.in&&G.mouse.mouse&&camera&&!G.over){const gp=groundPoint(G.mouse.sx,G.mouse.sy),tx=gp?terrText(cellAt(gp.x,gp.y)):'';tt.textContent=tx;tt.style.display=tx?'block':'none';}else tt.style.display='none';}
}
try{loadMap(cfg.map);init3D();buildWorld3D();}catch(err){console.error(err);showCard('<h1>Không khởi động được 3D</h1><p>Trình duyệt này chưa bật WebGL hoặc không tải được thư viện 3D. Hãy thử Chrome, Edge, Safari hoặc Firefox bản mới.</p>');}
{const mq=matchMedia('(max-width:760px), (max-height:520px)'),place=()=>{const mw=$('#miniWrap'),dst=mq.matches?$('#panel'):$('#leftCol');if(mw.parentNode!==dst)dst.insertBefore(mw,dst.firstChild);};
  place();if(mq.addEventListener)mq.addEventListener('change',place);else mq.addListener(place);}
new ResizeObserver(resize).observe($('#view'));window.addEventListener('resize',resize);resize();
if(renderer){showStart();requestAnimationFrame(loop);}
})();
</script>
